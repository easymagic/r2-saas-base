<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Orders — BorderlessFetch</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { sans: ['DM Sans', 'system-ui', 'sans-serif'] } } } };
  </script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&display=swap" rel="stylesheet" />
</head>
<body class="min-h-screen font-sans text-gray-900 antialiased" style="background: radial-gradient(1200px 500px at 0% -10%, rgba(30,58,95,.12), transparent 55%), linear-gradient(180deg,#f8fafc,#eef2f7);">
  <div class="flex min-h-screen">
    <input type="checkbox" id="mobile-nav" class="peer sr-only" />
    <label for="mobile-nav" class="fixed inset-0 z-40 bg-slate-900/40 opacity-0 pointer-events-none transition-opacity peer-checked:opacity-100 peer-checked:pointer-events-auto lg:hidden" aria-hidden="true"></label>
    <aside class="fixed left-0 top-0 z-50 flex h-full w-64 -translate-x-full flex-col border-r border-slate-200/80 bg-white/95 shadow-lg transition-transform duration-200 peer-checked:translate-x-0 lg:static lg:translate-x-0 lg:shadow-none" aria-label="Main navigation">
      <div class="flex h-16 items-center gap-2 border-b border-slate-100 px-6">
        <span class="flex h-9 w-9 items-center justify-center rounded-xl bg-blue-900 text-sm font-bold text-white">BF</span>
        <div>
          <p class="text-sm font-semibold text-gray-900">BorderlessFetch</p>
          <p class="text-xs text-slate-500">Fulfillment</p>
        </div>
      </div>
      <nav class="flex flex-1 flex-col gap-1 p-4">
        <a class="rounded-xl px-3 py-2 text-sm font-medium text-gray-700 hover:bg-slate-100" href="dashboard.html">Dashboard</a>
        <a class="rounded-xl px-3 py-2 text-sm font-medium text-gray-700 hover:bg-slate-100" href="create-order.html">Create order</a>
        <a class="rounded-xl bg-blue-900 px-3 py-2 text-sm font-medium text-white" href="orders.html" aria-current="page">Orders</a>
        <a class="rounded-xl px-3 py-2 text-sm font-medium text-gray-700 hover:bg-slate-100" href="wallet.html">Wallet</a>
      </nav>
      <div class="border-t border-slate-100 p-4">
        <a class="mt-1 flex items-center gap-3 rounded-xl px-3 py-2 text-sm text-slate-600 hover:bg-slate-100" href="login.html">Sign out</a>
      </div>
    </aside>

    <div class="flex min-w-0 flex-1 flex-col">
      <header class="sticky top-0 z-30 flex h-16 flex-wrap items-center justify-between gap-4 border-b border-slate-200/80 bg-white/90 px-4 backdrop-blur sm:px-6 lg:px-8">
        <div class="flex items-center gap-3">
          <label for="mobile-nav" class="inline-flex cursor-pointer items-center justify-center rounded-lg border border-gray-200 bg-white p-2 text-gray-700 hover:bg-gray-50 lg:hidden">
            <span class="sr-only">Open menu</span>
            <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" /></svg>
          </label>
          <div>
            <h1 class="text-lg font-semibold text-gray-900">Orders</h1>
            <p class="hidden text-sm text-gray-500 sm:block"><code class="text-xs">GET /v2/snappy-orders/my-orders</code></p>
          </div>
        </div>
        <a href="create-order.html" class="rounded-lg bg-blue-900 px-4 py-2 text-sm font-semibold text-white shadow-md hover:bg-blue-950">New order</a>
      </header>

      <main class="flex-1 p-4 sm:p-6 lg:p-8">
        <section class="rounded-2xl border border-slate-200/80 bg-white p-6 shadow-md">
          <div class="flex flex-col gap-4 sm:flex-row sm:items-center">
            <div class="relative flex-1">
              <label for="search" class="sr-only">Search orders</label>
              <input id="search" type="search" placeholder="Search by id, reference, or link…" class="w-full rounded-lg border border-gray-300 px-3 py-2 pl-10 text-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500" />
              <svg class="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z" /></svg>
            </div>
            <select class="rounded-lg border border-gray-300 bg-white px-3 py-2 text-sm font-medium text-gray-700 shadow-sm">
              <option value="">All statuses</option>
              <option value="pending">Pending</option>
              <option value="paid">Paid</option>
              <option value="assigned">Assigned</option>
              <option value="completed">Completed</option>
              <option value="cancelled">Cancelled</option>
            </select>
          </div>

          <div class="mt-6 overflow-x-auto">
            <table class="w-full min-w-[40rem] border-collapse text-left text-sm">
              <thead>
                <tr class="border-b border-gray-200 bg-slate-100 text-xs font-semibold uppercase tracking-wide text-gray-600">
                  <th class="px-4 py-3" scope="col">Order ID</th>
                  <th class="px-4 py-3" scope="col">Status</th>
                  <th class="px-4 py-3 text-right" scope="col">Amount</th>
                  <th class="px-4 py-3" scope="col">Date</th>
                  <th class="px-4 py-3 text-right" scope="col">Action</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-gray-100">
                <tr class="hover:bg-slate-50">
                  <td class="px-4 py-3 font-medium text-blue-900">#1042</td>
                  <td class="px-4 py-3"><span class="inline-flex rounded-full bg-yellow-100 px-2.5 py-0.5 text-xs font-medium text-yellow-700">Pending</span></td>
                  <td class="px-4 py-3 text-right tabular-nums">$50.00</td>
                  <td class="px-4 py-3 text-gray-600">Mar 22, 2026</td>
                  <td class="px-4 py-3 text-right"><a class="text-sm font-medium text-orange-600 hover:text-orange-700" href="#">Open</a></td>
                </tr>
                <tr class="hover:bg-slate-50">
                  <td class="px-4 py-3 font-medium text-blue-900">#1038</td>
                  <td class="px-4 py-3"><span class="inline-flex rounded-full bg-green-100 px-2.5 py-0.5 text-xs font-medium text-green-700">Paid</span></td>
                  <td class="px-4 py-3 text-right tabular-nums">$120.00</td>
                  <td class="px-4 py-3 text-gray-600">Mar 18, 2026</td>
                  <td class="px-4 py-3 text-right"><a class="text-sm font-medium text-orange-600 hover:text-orange-700" href="#">Open</a></td>
                </tr>
                <tr class="hover:bg-slate-50">
                  <td class="px-4 py-3 font-medium text-blue-900">#1031</td>
                  <td class="px-4 py-3"><span class="inline-flex rounded-full bg-blue-100 px-2.5 py-0.5 text-xs font-medium text-blue-700">Assigned</span></td>
                  <td class="px-4 py-3 text-right tabular-nums">$91.00</td>
                  <td class="px-4 py-3 text-gray-600">Mar 05, 2026</td>
                  <td class="px-4 py-3 text-right"><a class="text-sm font-medium text-orange-600 hover:text-orange-700" href="#">Open</a></td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
  </div>
</body>
</html>
