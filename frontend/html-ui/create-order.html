<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Create order — BorderlessFetch</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { sans: ['DM Sans', 'system-ui', 'sans-serif'] } } } };
  </script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&display=swap" rel="stylesheet" />
</head>
<body class="min-h-screen font-sans text-gray-900 antialiased" style="background: radial-gradient(1200px 500px at 0% -10%, rgba(30,58,95,.12), transparent 55%), linear-gradient(180deg,#f8fafc,#eef2f7);">
  <div class="flex min-h-screen">
    <input type="checkbox" id="mobile-nav" class="peer sr-only" />
    <label for="mobile-nav" class="fixed inset-0 z-40 bg-slate-900/40 opacity-0 pointer-events-none transition-opacity peer-checked:opacity-100 peer-checked:pointer-events-auto lg:hidden" aria-hidden="true"></label>
    <aside class="fixed left-0 top-0 z-50 flex h-full w-64 -translate-x-full flex-col border-r border-slate-200/80 bg-white/95 shadow-lg transition-transform duration-200 peer-checked:translate-x-0 lg:static lg:translate-x-0 lg:shadow-none" aria-label="Main navigation">
      <div class="flex h-16 items-center gap-2 border-b border-slate-100 px-6">
        <span class="flex h-9 w-9 items-center justify-center rounded-xl bg-blue-900 text-sm font-bold text-white">BF</span>
        <div>
          <p class="text-sm font-semibold text-gray-900">BorderlessFetch</p>
          <p class="text-xs text-slate-500">Fulfillment</p>
        </div>
      </div>
      <nav class="flex flex-1 flex-col gap-1 p-4">
        <a class="rounded-xl px-3 py-2 text-sm font-medium text-gray-700 hover:bg-slate-100" href="dashboard.html">Dashboard</a>
        <a class="rounded-xl bg-blue-900 px-3 py-2 text-sm font-medium text-white" href="create-order.html" aria-current="page">Create order</a>
        <a class="rounded-xl px-3 py-2 text-sm font-medium text-gray-700 hover:bg-slate-100" href="orders.html">Orders</a>
        <a class="rounded-xl px-3 py-2 text-sm font-medium text-gray-700 hover:bg-slate-100" href="wallet.html">Wallet</a>
      </nav>
      <div class="border-t border-slate-100 p-4">
        <a class="flex items-center gap-3 rounded-xl px-3 py-2 text-sm text-slate-600 hover:bg-slate-100" href="login.html">Sign out</a>
      </div>
    </aside>

    <div class="flex min-w-0 flex-1 flex-col">
      <header class="sticky top-0 z-30 flex h-16 items-center justify-between gap-4 border-b border-slate-200/80 bg-white/90 px-4 backdrop-blur sm:px-6 lg:px-8">
        <div class="flex items-center gap-3">
          <label for="mobile-nav" class="inline-flex cursor-pointer items-center justify-center rounded-lg border border-gray-200 bg-white p-2 text-gray-700 hover:bg-gray-50 lg:hidden">
            <span class="sr-only">Open menu</span>
            <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" /></svg>
          </label>
          <div>
            <h1 class="text-lg font-semibold text-gray-900">Create order</h1>
            <p class="hidden text-sm text-gray-500 sm:block"><code class="text-xs">POST /v2/snappy-orders</code> · multipart</p>
          </div>
        </div>
      </header>

      <main class="flex-1 p-4 sm:p-6 lg:p-8">
        <div class="mx-auto max-w-2xl">
          <section class="rounded-2xl border border-slate-200/80 bg-white p-6 shadow-md sm:p-8">
            <h2 class="text-base font-semibold text-gray-900">Product request</h2>
            <p class="mt-1 text-sm text-gray-500">Fields: <code class="rounded bg-slate-100 px-1 text-xs">link</code>, <code class="rounded bg-slate-100 px-1 text-xs">description</code>, <code class="rounded bg-slate-100 px-1 text-xs">total_amount_usd</code>, <code class="rounded bg-slate-100 px-1 text-xs">screen_shot1</code>–<code class="rounded bg-slate-100 px-1 text-xs">3</code>.</p>

            <form class="mt-6 space-y-6" action="#" method="post" enctype="multipart/form-data">
              <div>
                <label for="link" class="block text-sm font-medium text-gray-700">Product link</label>
                <input id="link" name="link" type="url" required class="mt-1 w-full rounded-lg border border-gray-300 px-3 py-2 text-sm shadow-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="https://..." />
              </div>
              <div>
                <label for="description" class="block text-sm font-medium text-gray-700">Description</label>
                <textarea id="description" name="description" rows="4" class="mt-1 w-full rounded-lg border border-gray-300 px-3 py-2 text-sm shadow-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Size, color, quantity…"></textarea>
              </div>
              <div>
                <span class="block text-sm font-medium text-gray-700">Screenshots</span>
                <p class="mt-1 text-xs text-gray-500"><code class="rounded bg-slate-100 px-1">screen_shot1</code> required</p>
                <div class="mt-3 grid gap-3 sm:grid-cols-3">
                  <label for="screen_shot1" class="flex min-h-[7rem] cursor-pointer flex-col items-center justify-center rounded-xl border-2 border-dashed border-slate-300 bg-slate-50 px-3 py-4 text-center text-sm hover:border-orange-400">Shot 1 *<input id="screen_shot1" name="screen_shot1" type="file" accept="image/*" required class="sr-only" /></label>
                  <label for="screen_shot2" class="flex min-h-[7rem] cursor-pointer flex-col items-center justify-center rounded-xl border-2 border-dashed border-slate-300 bg-slate-50 px-3 py-4 text-center text-sm hover:border-orange-400">Shot 2<input id="screen_shot2" name="screen_shot2" type="file" accept="image/*" class="sr-only" /></label>
                  <label for="screen_shot3" class="flex min-h-[7rem] cursor-pointer flex-col items-center justify-center rounded-xl border-2 border-dashed border-slate-300 bg-slate-50 px-3 py-4 text-center text-sm hover:border-orange-400">Shot 3<input id="screen_shot3" name="screen_shot3" type="file" accept="image/*" class="sr-only" /></label>
                </div>
              </div>
              <div>
                <label for="total_amount_usd" class="block text-sm font-medium text-gray-700">Amount (USD)</label>
                <input id="total_amount_usd" name="total_amount_usd" type="text" inputmode="decimal" required class="mt-1 w-full rounded-lg border border-gray-300 px-3 py-2 text-sm shadow-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="50" />
              </div>
              <div class="flex flex-wrap gap-3">
                <button type="submit" class="rounded-lg bg-blue-900 px-4 py-2 text-sm font-semibold text-white shadow-md hover:bg-blue-950">Submit order</button>
                <a href="orders.html" class="rounded-lg border border-gray-300 bg-white px-4 py-2 text-sm font-semibold text-gray-700 shadow-sm hover:bg-gray-50">Cancel</a>
              </div>
            </form>
          </section>
        </div>
      </main>
    </div>
  </div>
</body>
</html>
